<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="refablePurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d7bff"/>
      <stop offset="1" stop-color="#6f5ff0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="512" height="512" rx="104" fill="#0f1117"/>
  <!-- the raw prompt: small, faint chevron -->
  <path d="M 128 214 L 170 256 L 128 298" fill="none" stroke="#3d4460" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the refined prompt: bold chevron -->
