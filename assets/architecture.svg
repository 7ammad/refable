<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c6ff0"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="#0f1117"/>
  <text x="430" y="36" text-anchor="middle" fill="#e8e6f0" font-size="20" font-weight="600">refable — one skill, four surfaces</text>

  <!-- core -->
  <rect x="330" y="70" width="200" height="86" rx="12" fill="#1d1a33" stroke="#7c6ff0" stroke-width="2"/>
  <text x="430" y="103" text-anchor="middle" fill="#e8e6f0" font-size="15" font-weight="600">SKILL.md</text>
  <text x="430" y="124" text-anchor="middle" fill="#9b93c9" font-size="12">Fable 5 guide, distilled:</text>
  <text x="430" y="141" text-anchor="middle" fill="#9b93c9" font-size="12">add 5 patterns · subtract bloat</text>

  <!-- arrows -->
  <line x1="380" y1="156" x2="140" y2="230" stroke="#7c6ff0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="410" y1="156" x2="335" y2="230" stroke="#7c6ff0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="156" x2="525" y2="230" stroke="#7c6ff0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="480" y1="156" x2="720" y2="230" stroke="#7c6ff0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- surfaces -->
  <g>
    <rect x="40" y="238" width="190" height="96" rx="10" fill="#141824" stroke="#3d4460"/>
    <text x="135" y="265" text-anchor="middle" fill="#e8e6f0" font-size="13" font-weight="600">Claude Code / Desktop</text>
    <text x="135" y="286" text-anchor="middle" fill="#9b93c9" font-size="11">~/.claude/skills/enhance</text>
    <text x="135" y="304" text-anchor="middle" fill="#9b93c9" font-size="11">/enhance or auto-trigger</text>
    <text x="135" y="322" text-anchor="middle" fill="#6fd0a0" font-size="11">+ hook = fully automatic</text>
  </g>
  <g>
    <rect x="248" y="238" width="176" height="96" rx="10" fill="#141824" stroke="#3d4460"/>
    <text x="336" y="265" text-anchor="middle" fill="#e8e6f0" font-size="13" font-weight="600">claude.ai (web)</text>
    <text x="336" y="286" text-anchor="middle" fill="#9b93c9" font-size="11">zip → Settings →</text>
    <text x="336" y="304" text-anchor="middle" fill="#9b93c9" font-size="11">Capabilities → Skills</text>
    <text x="336" y="322" text-anchor="middle" fill="#9b93c9" font-size="11">same file, no changes</text>
  </g>
  <g>
    <rect x="442" y="238" width="176" height="96" rx="10" fill="#141824" stroke="#3d4460"/>
    <text x="530" y="265" text-anchor="middle" fill="#e8e6f0" font-size="13" font-weight="600">Codex / Cursor</text>
    <text x="530" y="286" text-anchor="middle" fill="#9b93c9" font-size="11">COUNCIL.md — shape the</text>
    <text x="530" y="304" text-anchor="middle" fill="#9b93c9" font-size="11">ask, reach Fable via</text>
    <text x="530" y="322" text-anchor="middle" fill="#9b93c9" font-size="11">claude -p --model fable</text>
  </g>
  <g>
    <rect x="636" y="238" width="184" height="96" rx="10" fill="#141824" stroke="#3d4460"/>
    <text x="728" y="265" text-anchor="middle" fill="#e8e6f0" font-size="13" font-weight="600">Model council</text>
    <text x="728" y="286" text-anchor="middle" fill="#9b93c9" font-size="11">orchestrators send</text>
    <text x="728" y="304" text-anchor="middle" fill="#9b93c9" font-size="11">Fable-shaped asks,</text>
    <text x="728" y="322" text-anchor="middle" fill="#9b93c9" font-size="11">read-only council seats</text>
  </g>

  <text x="430" y="392" text-anchor="middle" fill="#6b6491" font-size="12">source: Anthropic — “Prompting Claude Fable 5” · MIT · no telemetry</text>
</svg>
